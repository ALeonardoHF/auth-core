services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db;Database=AuthProject;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "AuthProject"
      JwtSettings__Audience: "AuthProject"
      AppSettings__BaseUrl: "${BASE_URL}"
      Gmail__Email: "${GMAIL_EMAIL}"
      Gmail__AppPassword: "${GMAIL_APP_PASSWORD}"
      Sentry__Dsn: "${SENTRY_DSN}"
    depends_on:
      - db
